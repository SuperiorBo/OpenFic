# Local source build for OpenFic (fork: SuperiorBo/OpenFic)
# Keeps named volume openfic:/data so business data survives image swaps.
services:
  openfic:
    build:
      context: .
      dockerfile: Dockerfile
    image: openfic:local
    container_name: openfic
    ports:
      - "9888:8000"
    volumes:
      - openfic:/data
    environment:
      OPENFIC_DATA_DIR: /data
      OPENFIC_FRONTEND_DIST: /app/app/frontend_dist
      # Gap between stream chunks before StreamChunkTimeoutError.
      # langchain_openai default is 120s; Grok mid-turn stalls often need more.
      # Set to 0 to disable. Code default is also 300 if env is unset.
      LANGCHAIN_OPENAI_STREAM_CHUNK_TIMEOUT_S: "300"
    restart: unless-stopped

volumes:
  openfic:
    external: true
